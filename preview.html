<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prévisualisation - Fiche Produit</title>
  
  <!-- Bibliothèques PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Google Fonts - Style Apple (SF Pro / Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/preview/preview-dashboard.css">
  <link rel="stylesheet" href="css/preview/preview-pdf.css">
  <link rel="stylesheet" href="css/preview/preview-badges.css">
  <link rel="stylesheet" href="css/preview/preview-responsive.css">
  <link rel="stylesheet" href="css/preview/preview-direct-editor.css">
  <link rel="stylesheet" href="css/preview/preview-figma-panel.css">
  <link rel="stylesheet" href="css/preview/preview-figma-spacing.css">
  <link rel="stylesheet" href="css/preview/preview-figma-typography.css">
  <link rel="stylesheet" href="css/preview/preview-figma-colors.css">
  <link rel="stylesheet" href="css/preview/preview-figma-borders.css">
  <link rel="stylesheet" href="css/preview/preview-figma-styles.css">
  <link rel="stylesheet" href="css/preview/preview-figma-grid.css">
  <link rel="stylesheet" href="css/preview/preview-figma-badges-manager.css">
  <link rel="stylesheet" href="css/preview/preview-image-manager.css">
  <link rel="stylesheet" href="css/preview/preview-sections-modal.css">
  <link rel="stylesheet" href="css/preview/preview-layers-highlight.css">
  <link rel="stylesheet" href="css/preview/preview-section-drag.css">
  
  <style>
    /* Variables spécifiques pour preview - Identité Otera authentique */
    :root {
      --color-primary: #E65B0C; /* Orange Otera - couleur principale du site */
      --color-secondary: #8B6F5E; /* Beige-orange moyen */
      --color-accent: #F5A872; /* Orange clair */
      --color-text: #2C2E2D; /* Noir/gris foncé */
      --color-pdf-bg: #FEFCF9; /* Beige très clair - fond du site */
      --color-accent-light: #FDF8F3; /* Beige clair - fond sections */
      --color-divider: #E8DCC8; /* Beige doux pour diviseurs */
      --color-highlight: #F5E6D3; /* Beige pastel pour les recettes */
      --color-badge: #E65B0C; /* Badge circuit-court - orange Otera */
      --color-badge-text: #FFFFFF; /* Texte badge blanc */
    }
  </style>
</head>
<body>
  <!-- Header fixe -->
  <header class="dashboard-header">
    <div class="header-content">
      <div class="header-left">
        <h1 id="pageTitle">Prévisualisation</h1>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="openMainPanelBtn" aria-label="Ouvrir le panel principal">
          <span class="icon">⚙️</span>
        </button>
        <button class="btn-icon" id="badgesToggleBtn" aria-label="Gérer les badges">
          <span class="icon">🏷️</span>
        </button>
        <button class="btn-icon" id="imageManagerToggleBtn" aria-label="Gérer les images" title="Rechercher et éditer des images">
          <span class="icon">🖼️</span>
        </button>
        <button class="btn-icon" id="downloadBtn" style="display: inline-flex;" aria-label="Télécharger PDF">
          <span class="icon">⬇️</span>
        </button>
        <a href="index.html?return=true" class="btn-icon" aria-label="Nouvelle fiche">
          <span class="icon">🔄</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Zone principale -->
  <main class="dashboard-main">
    <!-- PDF Preview -->
    <div class="preview-container">
      <!-- Loading -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Chargement de la prévisualisation...</p>
      </div>

      <!-- Error -->
      <div class="error" id="error" style="display: none;">
        <h2>❌ Erreur</h2>
        <p id="errorMessage"></p>
        <a href="index.html" class="btn btn-primary" style="margin-top: 20px;">
          Retour à l'accueil
        </a>
      </div>

      <!-- PDF Preview -->
      <div id="pdfPreview" style="display: none;"></div>
    </div>
    
    <!-- Drawer des badges (sidebar) -->
    <div id="badgesDrawer" class="badges-drawer">
      <div class="drawer-overlay" id="drawerOverlay"></div>
      <div class="drawer-content">
      <div class="drawer-header">
        <h2>Gérer les atouts</h2>
        <button class="drawer-close" id="drawerClose" aria-label="Fermer">
          <span>✕</span>
        </button>
      </div>
      
      <div class="drawer-body">
        <!-- Section: Sélection des badges -->
        <section class="badges-section">
          <h3>Ajouter des atouts</h3>
          <div class="badge-choices" id="badgeChoices">
            <span class="badge-choices-loading">Chargement des badges...</span>
          </div>
        </section>

        <!-- Section: Configuration des badges sélectionnés -->
        <section class="badges-config-section" id="badgeLayoutContainer">
          <h3>Configuration</h3>
          <p class="empty-state">Sélectionnez un atout pour le configurer</p>
        </section>
      </div>
    </div>
  </div>
  </main>

  <!-- JavaScript -->
  <script src="js/config.js?v=1.1"></script>
  <script src="js/api.js?v=1.1"></script>
  <script src="js/preview/preview-utils.js?v=1.1"></script>
  <script src="js/preview/preview-html-generator.js?v=1.3"></script>
  <script src="js/preview/preview-pdf-generator.js?v=1.4"></script>
  <script src="js/preview/preview-display.js?v=1.1"></script>
  <script src="js/preview/preview-data.js?v=1.1"></script>
  <script src="js/preview/preview-badges.js?v=1.1"></script>
  <script src="js/preview/preview-dashboard-controls.js?v=1.2"></script>
  <script src="js/preview/preview-content-editor.js?v=1.1"></script>
  <script src="js/preview/preview-direct-editor.js?v=1.1"></script>
  <script src="js/preview/preview-figma-panel.js?v=4.9"></script>
  <script src="js/preview/preview-figma-export.js?v=1.3"></script>
  <script src="js/preview/preview-image-manager.js?v=1.2"></script>
  <script src="js/preview/preview.js?v=1.2"></script>
</body>
</html>
